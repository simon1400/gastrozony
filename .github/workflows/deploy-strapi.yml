name: Deploy Strapi

on:
  push:
    branches: [main]
    paths:
      - 'strapi/**'
      - 'deploy/ecosystem.config.js'
      - '.github/workflows/deploy-strapi.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Strapi to server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            export PATH=/opt/node-v22/bin:/usr/local/bin:/usr/bin:/bin

            cd /opt/gastrozony
            git fetch origin main
            git reset --hard origin/main

            cd /opt/gastrozony/strapi
            # NODE_ENV=development — иначе npm ci пропустит devDependencies, нужные для сборки админки.
            # postinstall (patch-package) применяет патч strapi-plugin-imagekit.
            NODE_ENV=development npm ci

            rm -rf dist
            NODE_OPTIONS='--max-old-space-size=4096' npm run build
            # Strapi 5: dist/ — скомпилированный TS, .strapi/client — собранная админка
            test -d dist && test -d .strapi/client || { echo "BUILD FAILED"; exit 1; }

            pm2 restart gastrozony-strapi --update-env \
              || pm2 start /opt/gastrozony/deploy/ecosystem.config.js --only gastrozony-strapi
            pm2 save
            echo "✅ Strapi nasazen"
